# Recopie les catalogues CelesTrak dans la release « catalogues » du dépôt : le site en ligne les
# lit là, parce que CelesTrak ne répond pas à son hébergeur. CelesTrak publie toutes les deux
# heures et demande de ne pas télécharger plus souvent.
name: Relais des catalogues

on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/catalogues.yml]

permissions:
  contents: write

concurrency:
  group: catalogues
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Télécharger les catalogues CelesTrak
        # Format OMM en CSV : les objets lancés depuis mi-2026 ont des numéros NORAD au-delà de
        # 99999, que le format TLE ne sait pas écrire.
        run: |
          for group in visual last-30-days; do
            curl --fail --silent --show-error --max-time 60 \
              --user-agent "la-haut (+https://github.com/${GH_REPO})" \
              --output "${group}.csv" \
              "https://celestrak.org/NORAD/elements/gp.php?GROUP=${group}&FORMAT=csv"
            # Sans données, CelesTrak peut répondre par une phrase : on exige l'en-tête OMM et au
            # moins un satellite.
            satellites=$(tail -n +2 "${group}.csv" | grep -c . || true)
            if ! head -n 1 "${group}.csv" | grep -q '^OBJECT_NAME,' || [ "${satellites}" -eq 0 ]; then
              echo "::error::Le groupe ${group} ne contient aucun élément orbital"
              head -c 300 "${group}.csv"
              exit 1
            fi
            echo "${group} : ${satellites} satellites"
          done

      - name: Publier dans la release « catalogues »
        run: |
          notes="Copie des groupes CelesTrak visual et last-30-days au format OMM (CSV), remplacée toutes les deux heures par le workflow « Relais des catalogues ». Le site en ligne la lit : ne pas la supprimer."
          if ! gh release view catalogues > /dev/null 2>&1; then
            gh release create catalogues --latest=false --title "Catalogues CelesTrak" --notes "${notes}"
          fi
          gh release edit catalogues --notes "${notes}"
          gh release upload catalogues visual.csv last-30-days.csv --clobber
